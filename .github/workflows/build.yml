name: Build APK

# Builds an installable debug APK for every push, so nobody needs a local
# Android SDK to try the app.
on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# A newer push to the same branch makes the in-flight build irrelevant.
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Test and build
    runs-on: ubuntu-latest

    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up the Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Unit tests
        run: ./gradlew :core:test

      - name: Build debug APK
        run: ./gradlew :app:assembleDebug

      # The debug APK is signed with Android's standard debug key, so it
      # installs on a normal device without any extra signing setup.
      - name: Name the APK after the commit
        run: |
          mkdir -p artifacts
          cp app/build/outputs/apk/debug/app-debug.apk \
             "artifacts/shadow-firewall-${GITHUB_SHA::7}.apk"

      - name: Upload the APK
        uses: actions/upload-artifact@v4
        with:
          name: shadow-firewall-apk
          path: artifacts/*.apk
          retention-days: 30
          if-no-files-found: error

      - name: Upload reports when something fails
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-reports
          path: |
            core/build/reports/
            app/build/reports/
          retention-days: 7
          if-no-files-found: ignore
